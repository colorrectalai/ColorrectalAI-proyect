services:
  - type: web
    name: colorrectalai-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/v1/salud
    envVars:
      - key: MODELO_URL          # asset .onnx en GitHub Releases
        value: https://github.com/colorrectalai/ColorrectalAI-proyect/releases/download/v0.1.0/best.onnx
      - key: MODELO_SHA256       # registro_experimento.json
        value: b4c98b3538b28f2f22e7fbe6eaabff05662ad70cc9556de45bf881127a2410f3
      - key: MODELO_VERSION
        value: baseline-0.1
      - key: CORS_ORIGENES       # origen del frontend en GitHub Pages (+ local)
        value: https://colorrectalai.github.io,http://localhost:5173
