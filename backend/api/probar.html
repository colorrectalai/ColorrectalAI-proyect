<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColorrectalAI · Página de prueba</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #17324d; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .aviso { color: #6b7c8c; font-size: 13px; margin-bottom: 18px; }
  button { background: #0e7c9a; color: #fff; border: 0; padding: 10px 18px; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  canvas { max-width: 100%; border: 1px solid #cfe3ea; border-radius: 6px; margin-top: 16px; display: none; }
  #estado { margin: 14px 0 0; font-weight: 600; }
  pre { background: #f3f8fa; padding: 12px; border-radius: 6px; font-size: 12px; overflow: auto; }
  .error { color: #b3261e; }
</style>
</head>
<body>
<h1>ColorrectalAI · Página de prueba</h1>
<p class="aviso">Herramienta de desarrollo. Resultados experimentales con fines académicos; no constituyen un diagnóstico médico.</p>

<input type="file" id="archivo" accept="image/*">
<button id="enviar" disabled>Analizar imagen</button>

<p id="estado"></p>
<canvas id="lienzo"></canvas>
<pre id="json" hidden></pre>

<script>
const archivo = document.getElementById("archivo");
const enviar = document.getElementById("enviar");
const estado = document.getElementById("estado");
const lienzo = document.getElementById("lienzo");
const salida = document.getElementById("json");
let bitmap = null;

archivo.addEventListener("change", async () => {
  const f = archivo.files[0];
  enviar.disabled = !f;
  if (!f) return;
  try {                                   // el navegador decodifica JPG, PNG, AVIF, WEBP...
    bitmap = await createImageBitmap(f);
    lienzo.width = bitmap.width; lienzo.height = bitmap.height;
    lienzo.getContext("2d").drawImage(bitmap, 0, 0);
    lienzo.style.display = "block";
    estado.textContent = ""; salida.hidden = true;
  } catch { estado.innerHTML = '<span class="error">No se pudo leer esa imagen.</span>'; enviar.disabled = true; }
});

enviar.addEventListener("click", async () => {
  enviar.disabled = true;
  estado.textContent = "Analizando...";
  // Se envía como PNG, así cualquier formato del navegador funciona
  const blob = await new Promise(r => lienzo.toBlob(r, "image/png"));
  const datos = new FormData();
  datos.append("imagen", blob, "imagen.png");
  try {
    const resp = await fetch("/api/v1/inferencias", { method: "POST", body: datos });
    const j = await resp.json();
    if (!resp.ok) throw new Error(j.error ? j.error.mensaje : "Error " + resp.status);
    dibujar(j);
  } catch (e) {
    estado.innerHTML = '<span class="error">' + e.message + "</span>";
  }
  enviar.disabled = false;
});

function dibujar(j) {
  const ctx = lienzo.getContext("2d");
  ctx.drawImage(bitmap, 0, 0);
  ctx.lineWidth = Math.max(3, lienzo.width / 200);
  ctx.strokeStyle = "#00dc78"; ctx.fillStyle = "#00dc78";
  ctx.font = "bold " + Math.max(14, lienzo.width / 45) + "px sans-serif";
  for (const r of j.rois) {                       // coordenadas normalizadas 0-1
    const x = r.x * lienzo.width, y = r.y * lienzo.height;
    ctx.strokeRect(x, y, r.ancho * lienzo.width, r.alto * lienzo.height);
    ctx.fillText((r.confianza * 100).toFixed(0) + "%", x + 4, Math.max(16, y - 6));
  }
  estado.textContent = j.clasificacion === "posible_region"
    ? "Posible región · confianza " + (j.confianza * 100).toFixed(1) + "% · " + j.rois.length + " región(es)"
    : "Sin hallazgos";
  estado.textContent += " · " + j.metricas.latencia_ms + " ms";
  delete j.imagen_resultado;                      // es muy larga; aquí ya se dibujó
  salida.textContent = JSON.stringify(j, null, 2);
  salida.hidden = false;
}
</script>
</body>
</html>
